<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İsmail Çakmak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <script>
    try {
      const theme = sessionStorage.getItem('theme');
      if (theme === 'dark' || theme === 'istanbul') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="site-name">İsmail Çakmak</a>
      <div class="header-right">
        <nav>
          <ul class="header-nav">
            <li><a href="blog.html">blog</a></li>
            <li><a href="gallery.html">gallery</a></li>
            <li><a href="about.html">about</a></li>
          </ul>
        </nav>
        <button class="theme-toggle" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <span class="theme-label">light</span>
        </button>
      </div>
    </div>
  </header>

  <div class="container">
    <hr class="divider">
  </div>

  <main class="container page-content">

    <section class="intro">
      <div class="intro-photo-wrap">
        <img src="images/profile.png" alt="İsmail Çakmak" class="intro-photo" loading="eager" fetchpriority="high" decoding="async">
        <a href="https://www.claude-monet.com/the-poppy-field.jsp" class="intro-photo-link" aria-label="Open Claude Monet's The Poppy Field">#</a>
      </div>
      <div class="intro-text">
        <p>Life is a change given once, trying to make it worth to spend. I love building things and think about what god built.</p>
      </div>
    </section>

    <h2 class="section-title">Life</h2>
    <ul class="post-list" data-post-feed="life" data-post-tag="life" data-post-limit="5" aria-live="polite">
      <li class="post-item post-item-placeholder">Loading posts...</li>
    </ul>
    <p class="feed-status" data-post-status="life" hidden></p>

    <h2 class="section-title">Tech</h2>
    <ul class="post-list" data-post-feed="tech" data-post-tag="tech" data-post-limit="5" aria-live="polite">
      <li class="post-item post-item-placeholder">Loading posts...</li>
    </ul>
    <p class="feed-status" data-post-status="tech" hidden></p>

    <a href="blog.html" class="view-all">all posts &rarr;</a>

  </main>
  <script src="posts/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
